[project]
name = "sliver"
version = "6.0"
description = "The SLiVER LAbS VERification tool"
readme = "README.md"
authors = [{ name = "Luca Di Stefano", email = "luca.di.stefano@tuwien.ac.at" }]
requires-python = ">=3.14"
dependencies = [
    "click~=8.1.3",
    "jq>=1.11.0",
    "lark~=1.1.9",
    "msgspec>=0.21.1",
    "pycparser~=2.21",
    "pyparsing~=2.4.7",
    "pyrsistent>=0.20.0",
    "sympy>=1.14.0",
    "z3-solver~=4.16.0",
]

[project.urls]
Repository = "https://github.com/labs-lang/sliver"
Issues = "https://github.com/labs-lang/sliver/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = [
    "sliver/labs/LabsTranslate",
    "sliver/labs/templates/**",
    "sliver/minisat/minisat",
    "sliver/minisat/LICENSE",
    "sliver/cbmc/*",
    "sliver/esbmc/esbmc",
    "sliver/grammars/*.lark",
]

[tool.hatch.build.targets.wheel]
packages = ["sliver/"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
# tag = "py3-none-manylinux_2_17_x86_64"  # uncomment to override auto-detected platform tag
